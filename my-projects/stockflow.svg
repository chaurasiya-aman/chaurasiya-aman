
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">StockFlow — Inventory Management System</title>
  <desc id="desc">A modern purple and blue illustration of an inventory dashboard with stock cards, analytics, packages and a checklist.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f7ff"/>
      <stop offset="1" stop-color="#e8eaff"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7567ff"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#312e81" flood-opacity=".16"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#3730a3" flood-opacity=".10"/>
    </filter>
    <style>
      .ink {
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        fill: #172554;
      }
      .muted {
        fill: #64748b;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      .small { font-size: 12px; }
      .medium { font-size: 15px; font-weight: 600; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <circle cx="1090" cy="20" r="180" fill="#c4b5fd" opacity=".23"/>
  <circle cx="80" cy="470" r="190" fill="#a5b4fc" opacity=".20"/>

  <path d="M0 390 C170 330 220 460 370 405 S650 350 790 415 S1030 460 1200 360 V520 H0Z"
        fill="#c7d2fe" opacity=".35"/>

  <path d="M0 430 C180 370 260 485 420 435 S720 390 860 445 S1080 470 1200 420"
        fill="none" stroke="#a5b4fc" stroke-width="2" opacity=".5"/>

  <!-- Brand -->
  <g transform="translate(62 48)">
    <path d="M28 15 62 0 96 18 62 37Z" fill="#4f46e5"/>
    <path d="M28 15v39l34 20V37Z" fill="#6366f1"/>
    <path d="M62 37v37l34-20V18Z" fill="#312e81"/>

    <text x="116" y="48" class="ink" font-size="39" font-weight="800" letter-spacing="-1.5">
      Stock<tspan fill="#5145e5">Flow</tspan>
    </text>

    <text x="118" y="76" class="muted" font-size="14" letter-spacing="2.2">
      INVENTORY MANAGEMENT
    </text>
  </g>

  <!-- Feature list -->
  <g transform="translate(64 170)" filter="url(#soft)">

    <g>
      <rect width="220" height="54" rx="15" fill="#fff" opacity=".92"/>
      <circle cx="28" cy="27" r="15" fill="#ede9fe"/>
      <path d="M20 23 28 19 36 23 28 28Z M20 23v9l8 4v-8 M36 23v9l-8 4"
            fill="none" stroke="#5145e5" stroke-width="1.8" stroke-linejoin="round"/>
      <text x="55" y="33" class="ink medium">Manage Inventory</text>
    </g>

    <g transform="translate(0 66)">
      <rect width="220" height="54" rx="15" fill="#fff" opacity=".92"/>
      <circle cx="28" cy="27" r="15" fill="#ede9fe"/>
      <path d="M20 34V27h5v7 M27 34V21h5v13 M34 34V17h5v17"
            fill="none" stroke="#5145e5" stroke-width="2.4" stroke-linecap="round"/>
      <text x="55" y="33" class="ink medium">Track Stock Levels</text>
    </g>

    <g transform="translate(0 132)">
      <rect width="220" height="54" rx="15" fill="#fff" opacity=".92"/>
      <circle cx="28" cy="27" r="15" fill="#ede9fe"/>
      <rect x="20" y="19" width="16" height="17" rx="3"
            fill="none" stroke="#5145e5" stroke-width="2"/>
      <path d="m23 27 4 4 7-8" fill="none" stroke="#5145e5"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="55" y="33" class="ink medium">Monitor Products</text>
    </g>

  </g>

  <!-- Insights badge -->
  <g transform="translate(900 78)" filter="url(#soft)">
    <rect width="220" height="68" rx="18" fill="#fff" opacity=".94"/>
    <circle cx="34" cy="34" r="20" fill="#dcfce7"/>

    <path d="m24 39 9-10 7 5 10-13"
          fill="none" stroke="#16a34a" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M43 21h7v7" fill="none" stroke="#16a34a"
          stroke-width="3" stroke-linecap="round"/>

    <text x="68" y="29" class="muted small">INVENTORY INSIGHTS</text>
    <text x="68" y="49" class="ink" font-size="16" font-weight="700">
      Stay in control
    </text>
  </g>

  <!-- Laptop dashboard -->
  <g filter="url(#shadow)">

    <rect x="330" y="150" width="600" height="318" rx="19" fill="#1e293b"/>
    <rect x="342" y="162" width="576" height="294" rx="10" fill="url(#screen)"/>
    <circle cx="630" cy="156" r="2.5" fill="#94a3b8"/>

    <!-- Sidebar -->
    <path d="M352 162h132v294H352z" fill="#1e1b4b"/>

    <g transform="translate(369 181)">
      <path d="M0 7 12 0 24 7 12 14Z" fill="#818cf8"/>
      <path d="M0 7v14l12 7V14 M24 7v14l-12 7V14" fill="#6366f1"/>

      <text x="34" y="20" fill="#fff"
            font-family="Inter,system-ui,sans-serif"
            font-size="15" font-weight="700">StockFlow</text>
    </g>

    <g font-family="Inter,system-ui,sans-serif" font-size="12" fill="#c7d2fe">
      <rect x="362" y="229" width="111" height="31" rx="9" fill="#5145e5"/>
      <text x="379" y="249" fill="#fff" font-weight="600">▦ Dashboard</text>
      <text x="379" y="285">▣ Products</text>
      <text x="379" y="321">▤ Inventory</text>
      <text x="379" y="357">◷ Activity</text>
      <text x="379" y="393">⚙ Settings</text>
    </g>

    <!-- Dashboard heading -->
    <text x="505" y="194" class="ink" font-size="19" font-weight="750">
      Dashboard
    </text>

    <text x="505" y="214" class="muted" font-size="10">
      Your inventory at a glance
    </text>

    <!-- Summary cards -->
    <g filter="url(#soft)">
      <rect x="502" y="230" width="91" height="75" rx="11" fill="#fff"/>
      <rect x="601" y="230" width="91" height="75" rx="11" fill="#fff"/>
      <rect x="700" y="230" width="91" height="75" rx="11" fill="#fff"/>
      <rect x="799" y="230" width="101" height="75" rx="11" fill="#fff"/>
    </g>

    <g class="muted" font-size="10">
      <text x="514" y="250">Products</text>
      <text x="613" y="250">In Stock</text>
      <text x="712" y="250">Low Stock</text>
      <text x="811" y="250">Categories</text>
    </g>

    <g class="ink" font-size="22" font-weight="800">
      <text x="514" y="281">245</text>
      <text x="613" y="281">198</text>
      <text x="712" y="281">12</text>
      <text x="811" y="281">08</text>
    </g>

    <g fill="#16a34a" font-size="9" font-family="Inter,system-ui,sans-serif">
      <text x="514" y="295">Total items</text>
      <text x="613" y="295">Available</text>
    </g>

    <text x="712" y="295" fill="#ea580c"
          font-size="9" font-family="Inter,system-ui,sans-serif">
      Needs attention
    </text>

    <text x="811" y="295" fill="#64748b"
          font-size="9" font-family="Inter,system-ui,sans-serif">
      Organized
    </text>

    <!-- Analytics chart -->
    <rect x="502" y="317" width="398" height="121" rx="12"
          fill="#fff" filter="url(#soft)"/>

    <text x="518" y="340" class="ink" font-size="12" font-weight="700">
      Inventory Overview
    </text>

    <text x="868" y="340" class="muted" font-size="9" text-anchor="end">
      LAST 7 DAYS
    </text>

    <g stroke="#e2e8f0" stroke-width="1">
      <path d="M520 365H880 M520 389H880 M520 413H880"/>
    </g>

    <path d="M520 410 565 395 610 401 655 375 700 385 745 365 790 378 835 350 880 358V420H520Z"
          fill="#c4b5fd" opacity=".32"/>

    <path d="M520 410 565 395 610 401 655 375 700 385 745 365 790 378 835 350 880 358"
          fill="none" stroke="#635bdb" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round"/>

    <g fill="#fff" stroke="#635bdb" stroke-width="2">
      <circle cx="520" cy="410" r="3"/>
      <circle cx="565" cy="395" r="3"/>
      <circle cx="610" cy="401" r="3"/>
      <circle cx="655" cy="375" r="3"/>
      <circle cx="700" cy="385" r="3"/>
      <circle cx="745" cy="365" r="3"/>
      <circle cx="790" cy="378" r="3"/>
      <circle cx="835" cy="350" r="3"/>
      <circle cx="880" cy="358" r="3"/>
    </g>

    <!-- Laptop base -->
    <path d="M310 468H950L982 487Q984 493 970 493H290Q276 493 280 487Z"
          fill="#64748b"/>
    <path d="M310 468H950L965 481H295Z" fill="#94a3b8"/>
    <rect x="585" y="470" width="90" height="7" rx="3.5" fill="#475569"/>

  </g>

  <!-- Inventory packages -->
  <g transform="translate(62 366)" filter="url(#soft)">
    <path d="M0 20 65 0 130 20 65 43Z" fill="#fbbf24"/>
    <path d="M0 20v78l65 28V43Z" fill="#f59e0b"/>
    <path d="M130 20v78l-65 28V43Z" fill="#d97706"/>
    <path d="M65 0v43" stroke="#fff7ed" stroke-width="3"/>
    <path d="M48 12 83 24" stroke="#fff7ed" stroke-width="3" opacity=".8"/>

    <rect x="43" y="73" width="43" height="22" rx="3" fill="#ffedd5"/>

    <path d="M49 78v12 M54 78v12 M59 78v12 M64 78v12 M70 78v12 M76 78v12"
          stroke="#92400e" stroke-width="2"/>
  </g>

  <!-- Stock checklist -->
  <g transform="translate(1000 205)" filter="url(#soft)">
    <rect x="0" y="0" width="140" height="190" rx="16" fill="#fff"/>
    <rect x="48" y="-9" width="44" height="18" rx="7" fill="#818cf8"/>

    <text x="18" y="34" class="ink" font-size="13" font-weight="700">
      Stock Tasks
    </text>

    <g fill="none" stroke="#6366f1" stroke-width="2.5"
       stroke-linecap="round" stroke-linejoin="round">

      <rect x="18" y="52" width="15" height="15" rx="4"/>
      <path d="m21 59 4 4 7-9"/>

      <rect x="18" y="86" width="15" height="15" rx="4"/>
      <path d="m21 93 4 4 7-9"/>

      <rect x="18" y="120" width="15" height="15" rx="4"/>
      <path d="m21 127 4 4 7-9"/>

      <rect x="18" y="154" width="15" height="15" rx="4"/>
    </g>

    <g stroke="#cbd5e1" stroke-width="5" stroke-linecap="round">
      <path d="M45 59h75"/>
      <path d="M45 93h65"/>
      <path d="M45 127h75"/>
      <path d="M45 161h54"/>
    </g>
  </g>

  <!-- Decorative elements -->
  <g fill="#818cf8" opacity=".65">
    <circle cx="300" cy="130" r="4"/>
    <circle cx="315" cy="130" r="4"/>
    <circle cx="300" cy="145" r="4"/>
    <circle cx="965" cy="165" r="4"/>
    <circle cx="980" cy="165" r="4"/>
    <circle cx="965" cy="180" r="4"/>
  </g>

  <!-- Footer -->
  <text x="600" y="512" text-anchor="middle"
        class="muted" font-size="10" letter-spacing="2">
    TRACK • MANAGE • GROW
  </text>

</svg>
