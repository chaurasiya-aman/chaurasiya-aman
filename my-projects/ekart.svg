<svg xmlns="http://www.w3.org/2000/svg"
     width="900"
     height="560"
     viewBox="0 0 900 560">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090514"/>
      <stop offset="50%" stop-color="#160b31"/>
      <stop offset="100%" stop-color="#08020f"/>
    </linearGradient>

    <!-- Header gradient -->
    <linearGradient id="headerGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="50%" stop-color="#bf55ec"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>

    <!-- Cyan gradient -->
    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#77f7ff"/>
    </linearGradient>

    <!-- Pink gradient -->
    <linearGradient id="pinkGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#ff77bc"/>
    </linearGradient>

    <!-- Card gradient -->
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#17102c"/>
      <stop offset="100%" stop-color="#0e081d"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <!-- Grid -->
    <pattern id="grid"
             width="35"
             height="35"
             patternUnits="userSpaceOnUse">
      <path d="M 35 0 L 0 0 0 35"
            fill="none"
            stroke="#8b5cf6"
            stroke-width="0.5"
            opacity="0.13"/>
    </pattern>

  </defs>


  <!-- ===================================================== -->
  <!-- MAIN BACKGROUND                                       -->
  <!-- ===================================================== -->

  <rect
    x="4"
    y="4"
    width="892"
    height="552"
    rx="24"
    fill="url(#bg)"
    stroke="#ff007f"
    stroke-width="2"
  />

  <!-- Background grid -->
  <rect
    x="5"
    y="5"
    width="890"
    height="550"
    rx="23"
    fill="url(#grid)"
  />

  <!-- Top neon line -->
  <rect
    x="25"
    y="24"
    width="850"
    height="3"
    rx="2"
    fill="url(#headerGlow)"
  />

  <!-- Ambient glow -->
  <circle
    cx="760"
    cy="100"
    r="100"
    fill="#00f0ff"
    opacity="0.04"
    filter="url(#softGlow)"
  />

  <circle
    cx="130"
    cy="450"
    r="120"
    fill="#ff007f"
    opacity="0.04"
    filter="url(#softGlow)"
  />


  <!-- ===================================================== -->
  <!-- HEADER                                                 -->
  <!-- ===================================================== -->

  <text
    x="45"
    y="70"
    fill="#ff77bc"
    font-family="Courier New, monospace"
    font-size="17"
    font-weight="bold"
    letter-spacing="4">
    MERN FULL-STACK PROJECT
  </text>

  <text
    x="45"
    y="116"
    fill="#ffffff"
    font-family="Arial, Helvetica, sans-serif"
    font-size="34"
    font-weight="bold">
    eKart Store
  </text>

  <text
    x="45"
    y="145"
    fill="#94a3b8"
    font-family="Arial, Helvetica, sans-serif"
    font-size="15">
    Full-Stack E-Commerce Platform
  </text>


  <!-- ===================================================== -->
  <!-- REACT ATOM                                             -->
  <!-- ===================================================== -->

  <g transform="translate(760 92)">

    <ellipse
      cx="0"
      cy="0"
      rx="65"
      ry="20"
      fill="none"
      stroke="#00f0ff"
      stroke-width="2"
      opacity="0.8"/>

    <ellipse
      cx="0"
      cy="0"
      rx="65"
      ry="20"
      fill="none"
      stroke="#00f0ff"
      stroke-width="2"
      opacity="0.8"
      transform="rotate(60)"/>

    <ellipse
      cx="0"
      cy="0"
      rx="65"
      ry="20"
      fill="none"
      stroke="#00f0ff"
      stroke-width="2"
      opacity="0.8"
      transform="rotate(120)"/>

    <circle
      cx="0"
      cy="0"
      r="9"
      fill="#00f0ff"
      filter="url(#glow)"/>

  </g>


  <!-- ===================================================== -->
  <!-- TECHNOLOGY BADGES                                      -->
  <!-- ===================================================== -->

  <g font-family="Courier New, monospace" font-size="13" font-weight="bold">

    <!-- React -->
    <rect
      x="45"
      y="175"
      width="95"
      height="32"
      rx="7"
      fill="#ff007f"
      fill-opacity="0.12"
      stroke="#ff007f"
      stroke-width="1"/>

    <text
      x="92"
      y="196"
      fill="#ff77bc"
      text-anchor="middle">
      React
    </text>


    <!-- Node -->
    <rect
      x="150"
      y="175"
      width="90"
      height="32"
      rx="7"
      fill="#00f0ff"
      fill-opacity="0.10"
      stroke="#00f0ff"
      stroke-width="1"/>

    <text
      x="195"
      y="196"
      fill="#77f7ff"
      text-anchor="middle">
      Node.js
    </text>


    <!-- Express -->
    <rect
      x="250"
      y="175"
      width="105"
      height="32"
      rx="7"
      fill="#00f0ff"
      fill-opacity="0.10"
      stroke="#00f0ff"
      stroke-width="1"/>

    <text
      x="302"
      y="196"
      fill="#77f7ff"
      text-anchor="middle">
      Express
    </text>


    <!-- MongoDB -->
    <rect
      x="365"
      y="175"
      width="105"
      height="32"
      rx="7"
      fill="#39ff14"
      fill-opacity="0.09"
      stroke="#39ff14"
      stroke-width="1"/>

    <text
      x="417"
      y="196"
      fill="#8aff75"
      text-anchor="middle">
      MongoDB
    </text>


    <!-- Redux -->
    <rect
      x="480"
      y="175"
      width="95"
      height="32"
      rx="7"
      fill="#bf55ec"
      fill-opacity="0.10"
      stroke="#bf55ec"
      stroke-width="1"/>

    <text
      x="527"
      y="196"
      fill="#df9bf5"
      text-anchor="middle">
      Redux
    </text>

  </g>


  <!-- ===================================================== -->
  <!-- FEATURE CARD                                           -->
  <!-- ===================================================== -->

  <rect
    x="45"
    y="235"
    width="810"
    height="205"
    rx="16"
    fill="url(#cardGradient)"
    stroke="#5b3c83"
    stroke-width="1"
  />


  <!-- Left accent -->
  <rect
    x="45"
    y="235"
    width="4"
    height="205"
    rx="2"
    fill="url(#headerGlow)"
  />


  <!-- Feature 1 -->
  <circle
    cx="78"
    cy="275"
    r="6"
    fill="#00f0ff"
    filter="url(#glow)"
  />

  <text
    x="100"
    y="280"
    fill="#e2e8f0"
    font-family="Arial, Helvetica, sans-serif"
    font-size="17">
    JWT authentication with refresh-cookie flow
  </text>


  <!-- Feature 2 -->
  <circle
    cx="78"
    cy="320"
    r="6"
    fill="#00f0ff"
    filter="url(#glow)"
  />

  <text
    x="100"
    y="325"
    fill="#e2e8f0"
    font-family="Arial, Helvetica, sans-serif"
    font-size="17">
    Automated email verification and re-verification
  </text>


  <!-- Feature 3 -->
  <circle
    cx="78"
    cy="365"
    r="6"
    fill="#00f0ff"
    filter="url(#glow)"
  />

  <text
    x="100"
    y="370"
    fill="#e2e8f0"
    font-family="Arial, Helvetica, sans-serif"
    font-size="17">
    Cloudinary image pipeline with MongoDB Atlas
  </text>


  <!-- Feature 4 -->
  <circle
    cx="78"
    cy="410"
    r="6"
    fill="#00f0ff"
    filter="url(#glow)"
  />

  <text
    x="100"
    y="415"
    fill="#e2e8f0"
    font-family="Arial, Helvetica, sans-serif"
    font-size="17">
    AI shopping assistant for product discovery
  </text>


  <!-- ===================================================== -->
  <!-- FOOTER                                                 -->
  <!-- ===================================================== -->

  <rect
    x="45"
    y="465"
    width="810"
    height="55"
    rx="10"
    fill="#150d2a"
    stroke="#ff007f"
    stroke-width="1"
  />

  <!-- Status -->
  <circle
    cx="70"
    cy="492"
    r="7"
    fill="#39ff14"
    filter="url(#glow)"
  />

  <text
    x="88"
    y="498"
    fill="#00f0ff"
    font-family="Courier New, monospace"
    font-size="14"
    font-weight="bold">
    DEPLOYED ON RENDER
  </text>

  <text
    x="825"
    y="498"
    fill="#ff77bc"
    font-family="Courier New, monospace"
    font-size="13"
    text-anchor="end">
    e-commerce-ekart.onrender.com
  </text>


  <!-- ===================================================== -->
  <!-- CORNER DECORATION                                      -->
  <!-- ===================================================== -->

  <path
    d="M 850 45 L 875 45 L 875 70"
    fill="none"
    stroke="#00f0ff"
    stroke-width="2"/>

  <path
    d="M 25 490 L 25 515 L 50 515"
    fill="none"
    stroke="#ff007f"
    stroke-width="2"/>

</svg>
