<svg width="1200" height="450" viewBox="0 0 1200 450"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#0b1026"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>

    <pattern id="grid" width="45" height="45"
             patternUnits="userSpaceOnUse">
      <path d="M45 0H0V45"
            fill="none"
            stroke="#26304d"
            stroke-width="1"
            opacity="0.35"/>
    </pattern>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00eaff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00eaff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00eaff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="450" fill="url(#bg)"/>
  <rect width="1200" height="450" fill="url(#grid)"/>

  <rect x="15" y="15"
        width="1170"
        height="420"
        rx="12"
        fill="none"
        stroke="#00eaff"
        stroke-width="1"
        opacity="0.45"/>

  <g fill="none"
     stroke="#00eaff"
     stroke-width="3"
     filter="url(#glow)">
    <path d="M40 75V40H75"/>
    <path d="M1125 40H1160V75"/>
    <path d="M40 375V410H75"/>
    <path d="M1125 410H1160V375"/>
  </g>

  <rect x="40" y="70"
        width="1120"
        height="2"
        fill="url(#scan)">
    <animate
      attributeName="y"
      values="70;380;70"
      dur="6s"
      repeatCount="indefinite"/>
  </rect>

  <circle cx="90" cy="92"
          r="6"
          fill="#00ff9d"
          filter="url(#glow)"/>

  <text x="108" y="99"
        fill="#00ff9d"
        font-family="monospace"
        font-size="17"
        font-weight="600"
        letter-spacing="2">
    OPEN TO WORK
  </text>

  <text x="600" y="205"
        text-anchor="middle"
        fill="#00eaff"
        font-family="monospace"
        font-size="72"
        font-weight="700"
        opacity="0.45"
        filter="url(#glow)">
    Aman Chaurasiya
  </text>

  <text x="600" y="205"
        text-anchor="middle"
        fill="#ffffff"
        font-family="monospace"
        font-size="72"
        font-weight="700">
    Aman Chaurasiya
  </text>

  <text x="600" y="255"
        text-anchor="middle"
        fill="#00eaff"
        font-family="monospace"
        font-size="22"
        font-weight="600"
        letter-spacing="3">
    SOFTWARE ENGINEER • JAVA • FULL STACK
  </text>

  <text x="600" y="300"
        text-anchor="middle"
        fill="#9aa7c7"
        font-family="monospace"
        font-size="18">
    &lt; Solve Problems • Build Systems  /&gt;
  </text>

  <text x="55" y="405"
        fill="#64748b"
        font-family="monospace"
        font-size="15">
    v2026 • SOFTWARE_DEV
  </text>

  <text x="1145" y="405"
        text-anchor="end"
        fill="#00eaff"
        font-family="monospace"
        font-size="15">
    java ✓
  </text>

  <g fill="#00eaff">
    <circle cx="180" cy="170" r="2">
      <animate attributeName="opacity"
               values="0.2;1;0.2"
               dur="2.5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="1030" cy="215" r="2">
      <animate attributeName="opacity"
               values="1;0.2;1"
               dur="3s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="250" cy="330" r="1.5">
      <animate attributeName="opacity"
               values="0.2;1;0.2"
               dur="2s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="950" cy="140" r="1.5">
      <animate attributeName="opacity"
               values="1;0.2;1"
               dur="2.5s"
               repeatCount="indefinite"/>
    </circle>
  </g>

</svg>
