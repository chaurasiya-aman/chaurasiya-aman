<svg xmlns="http://www.w3.org/2000/svg" 
     viewBox="0 0 1200 500" 
     width="100%" 
     height="100%" 
     preserveAspectRatio="xMidYMid meet" 
     role="img" 
     aria-labelledby="aboutTitle aboutDesc">

  <title id="aboutTitle">Aman Chaurasiya - About Me</title>
  <desc id="aboutDesc">Animated About Me HUD card for Aman Chaurasiya, Software Engineer and B.Tech CSE student graduating in 2027.</desc>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#0b1026"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="45" height="45" patternUnits="userSpaceOnUse">
      <path d="M45 0H0V45" fill="none" stroke="#26304d" stroke-width="1" opacity="0.35"/>
    </pattern>

    <!-- Cyan Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scan Line Gradient -->
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00eaff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00eaff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00eaff" stop-opacity="0"/>
    </linearGradient>

    <!-- Right Panel Fill Gradient -->
    <linearGradient id="panelFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0f1d" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#060913" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- Base Canvas Background -->
  <g id="background">
    <rect width="1200" height="500" fill="url(#bg)"/>
    <rect width="1200" height="500" fill="url(#grid)"/>

    <!-- Ambient Particles -->
    <circle cx="180" cy="120" r="2" fill="#00eaff">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="100" r="1.5" fill="#00eaff">
      <animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="465" r="1.5" fill="#00ff9d">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1160" cy="465" r="1.5" fill="#8c7bff">
      <animate attributeName="opacity" values="1;0.25;1" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="90" cy="300" r="1.5" fill="#00eaff">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- HUD Frame & Accents -->
  <g id="hud-frame">
    <!-- Outer Border -->
    <rect x="20" y="15" width="1160" height="470" rx="12"
          fill="none" stroke="#00eaff" stroke-width="1" opacity="0.35"/>

    <!-- Corner Brackets -->
    <g fill="none" stroke="#00eaff" stroke-width="3" filter="url(#glow)">
      <path d="M40 65V35H70"/>
      <path d="M1130 35H1160V65"/>
      <path d="M40 435V465H70"/>
      <path d="M1130 465H1160V435"/>
    </g>

    <!-- Scan Line -->
    <rect x="40" y="35" width="1120" height="2" fill="url(#scan)">
      <animate attributeName="y" values="35;465;35" dur="8s" repeatCount="indefinite"/>
    </rect>

    <!-- Header Terminal Prompt -->
    <text x="50" y="58" fill="#00eaff" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="600" letter-spacing="1">
      &gt; ./about-me
    </text>

    <!-- Status Indicator: Open to Work -->
    <g transform="translate(1005, 45)">
      <circle cx="10" cy="11" r="4.5" fill="#00ff9d" filter="url(#glow)">
        <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="24" y="15" fill="#00ff9d" font-family="'Courier New', Courier, monospace" font-size="12" font-weight="600" letter-spacing="1.5">
        OPEN TO WORK
      </text>
    </g>

    <!-- Top Dividing Line -->
    <line x1="40" y1="78" x2="1160" y2="78" stroke="#26304d" stroke-width="1" opacity="0.5"/>

    <!-- Central Vertical Spine -->
    <line x1="640" y1="95" x2="640" y2="465" stroke="#1b2540" stroke-width="1"/>
    <circle cx="640" cy="150" r="2" fill="#00eaff">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="280" r="2" fill="#00ff9d">
      <animate attributeName="opacity" values="1;0.25;1" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="410" r="2" fill="#8c7bff">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Left Column: Bio & Terminal Indicators -->
  <g id="left-column">
    <!-- Header Title -->
    <text x="50" y="132" fill="#00eaff" font-family="'Courier New', Courier, monospace" font-size="38" font-weight="800" opacity="0.3" filter="url(#glow)">ABOUT ME</text>
    <text x="50" y="132" fill="#ffffff" font-family="'Courier New', Courier, monospace" font-size="38" font-weight="800">ABOUT ME</text>
    <rect x="50" y="144" width="60" height="3" fill="#00eaff" filter="url(#glow)"/>

    <!-- Tagline -->
    <text x="50" y="172" fill="#64748b" font-family="'Courier New', Courier, monospace" font-size="13">
      &lt; building practical software, one commit at a time /&gt;
    </text>

    <!-- Biography Lines -->
    <text x="50" y="210" font-family="'Courier New', Courier, monospace" font-size="15" fill="#c9d3ef">
      <tspan x="50" dy="0">I'm Aman Chaurasiya, a B.Tech Computer Science student</tspan>
      <tspan x="50" dy="26">graduating in 2027 and an aspiring Software Engineer.</tspan>
      <tspan x="50" dy="26">I enjoy solving problems with Java and Data Structures</tspan>
      <tspan x="50" dy="26">&amp; Algorithms while building full-stack applications</tspan>
      <tspan x="50" dy="26">using React.js, Node.js, Express.js, and MongoDB.</tspan>
      <tspan x="50" dy="32">I focus on building practical software, strengthening</tspan>
      <tspan x="50" dy="26">core fundamentals, and continuously improving my</tspan>
      <tspan x="50" dy="26">engineering problem-solving skills.</tspan>
    </text>

    <!-- Progress Meter -->
    <g transform="translate(50, 425)">
      <text x="0" y="0" fill="#64748b" font-family="'Courier New', Courier, monospace" font-size="10.5" letter-spacing="1">
        STATUS: STRENGTHENING_CORE_FUNDAMENTALS
      </text>
      <rect x="0" y="9" width="340" height="6" rx="3" fill="#131a2b" stroke="#26304d" stroke-width="1"/>
      <rect x="0" y="9" width="80" height="6" rx="3" fill="#00eaff">
        <animate attributeName="width" values="40;310;40" dur="4.5s" repeatCount="indefinite"/>
      </rect>
      <text x="0" y="32" fill="#475569" font-family="'Courier New', Courier, monospace" font-size="11">
        v2026 • ABOUT_ME
      </text>
    </g>
  </g>

  <!-- Right Column: Profile Specs & Tech Badges -->
  <g id="right-column" transform="translate(670, 95)">
    <!-- Card Container -->
    <rect width="480" height="370" rx="8" fill="url(#panelFill)" stroke="#26304d" stroke-width="1"/>

    <!-- Card Titlebar -->
    <circle cx="22" cy="22" r="4" fill="#00eaff" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="35" y="26" fill="#9aa7c7" font-family="'Courier New', Courier, monospace" font-size="12.5" font-weight="600" letter-spacing="1">
      profile.sys
    </text>
    <line x1="0" y1="42" x2="480" y2="42" stroke="#26304d" stroke-width="1" opacity="0.4"/>

    <!-- Floating Decorative Element -->
    <g stroke="#8c7bff" stroke-width="1" fill="none" opacity="0.4">
      <rect x="450" y="14" width="12" height="12" rx="2">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 4; 0 0" dur="4s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Field 1: Role -->
    <g transform="translate(20, 58)">
      <rect x="0" y="0" width="2" height="26" fill="#00eaff" opacity="0.7"/>
      <text x="12" y="10" fill="#64748b" font-family="'Courier New', Courier, monospace" font-size="10.5" letter-spacing="1.5">ROLE</text>
      <text x="12" y="25" fill="#ffffff" font-family="'Courier New', Courier, monospace" font-size="14.5" font-weight="bold">Software Engineer</text>
    </g>

    <!-- Field 2: Education -->
    <g transform="translate(20, 102)">
      <rect x="0" y="0" width="2" height="26" fill="#00eaff" opacity="0.7"/>
      <text x="12" y="10" fill="#64748b" font-family="'Courier New', Courier, monospace" font-size="10.5" letter-spacing="1.5">EDUCATION</text>
      <text x="12" y="25" fill="#ffffff" font-family="'Courier New', Courier, monospace" font-size="14.5" font-weight="bold">B.Tech CSE • Class of 2027</text>
    </g>

    <!-- Field 3: Primary Focus -->
    <g transform="translate(20, 146)">
      <rect x="0" y="0" width="2" height="26" fill="#00eaff" opacity="0.7"/>
      <text x="12" y="10" fill="#64748b" font-family="'Courier New', Courier, monospace" font-size="10.5" letter-spacing="1.5">PRIMARY FOCUS</text>
      <text x="12" y="25" fill="#ffffff" font-family="'Courier New', Courier, monospace" font-size="14.5" font-weight="bold">DSA (Java) • Full Stack Development</text>
    </g>

    <!-- Field 4: Currently Building -->
    <g transform="translate(20, 190)">
      <rect x="0" y="0" width="2" height="26" fill="#00ff9d" opacity="0.7"/>
      <text x="12" y="10" fill="#64748b" font-family="'Courier New', Courier, monospace" font-size="10.5" letter-spacing="1.5">CURRENTLY BUILDING</text>
      <text x="12" y="25" fill="#ffffff" font-family="'Courier New', Courier, monospace" font-size="14.5" font-weight="bold">Real-World Software Systems</text>
      <circle cx="435" cy="18" r="3" fill="#00ff9d">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Divider -->
    <line x1="20" y1="236" x2="460" y2="236" stroke="#26304d" stroke-width="1" opacity="0.4"/>

    <!-- Tech Stack Label -->
    <text x="20" y="256" fill="#64748b" font-family="'Courier New', Courier, monospace" font-size="10.5" letter-spacing="1.5">
      CORE TECH STACK
    </text>

    <!-- Tech Stack Grid Chips -->
    <g transform="translate(20, 270)" font-family="'Courier New', Courier, monospace" font-size="12" fill="#cfe9ff">
      <!-- Row 1 -->
      <g transform="translate(0, 0)">
        <rect width="138" height="26" rx="5" fill="#111a2e" stroke="#00eaff" stroke-width="0.7" stroke-opacity="0.35"/>
        <text x="69" y="17" text-anchor="middle">Java</text>
      </g>
      <g transform="translate(150, 0)">
        <rect width="138" height="26" rx="5" fill="#111a2e" stroke="#00eaff" stroke-width="0.7" stroke-opacity="0.35"/>
        <text x="69" y="17" text-anchor="middle">JavaScript</text>
      </g>
      <g transform="translate(300, 0)">
        <rect width="140" height="26" rx="5" fill="#111a2e" stroke="#00eaff" stroke-width="0.7" stroke-opacity="0.35"/>
        <text x="70" y="17" text-anchor="middle">React.js</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 36)">
        <rect width="138" height="26" rx="5" fill="#111a2e" stroke="#00eaff" stroke-width="0.7" stroke-opacity="0.35"/>
        <text x="69" y="17" text-anchor="middle">Node.js</text>
      </g>
      <g transform="translate(150, 36)">
        <rect width="138" height="26" rx="5" fill="#111a2e" stroke="#00eaff" stroke-width="0.7" stroke-opacity="0.35"/>
        <text x="69" y="17" text-anchor="middle">Express.js</text>
      </g>
      <g transform="translate(300, 36)">
        <rect width="140" height="26" rx="5" fill="#111a2e" stroke="#00eaff" stroke-width="0.7" stroke-opacity="0.35"/>
        <text x="70" y="17" text-anchor="middle">MongoDB</text>
      </g>
    </g>
  </g>

</svg>
